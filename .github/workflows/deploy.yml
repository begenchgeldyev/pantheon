name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Set up ssh
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts

      - name: Deploy
        run: |
          ssh -o IdentitiesOnly=yes \
          "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
          'set -euo pipefail
           cd /opt/pantheon
           git fetch origin main
           git reset --hard origin/main
           bash bin/remind.test.sh
           bash bin/standup-intake.test.sh
           # OpenClaw polls the bot token now; a second poller (the old container) breaks it.
           docker rm -f pantheon >/dev/null 2>&1 || true
           install -d -m 755 /home/openclaw/bin/remind-impl
           for f in remind remind-in remind-cron remind-list remind-rm; do install -m 755 "bin/remind-impl/$f" /home/openclaw/bin/remind-impl/; done
           install -m 644 bin/remind-impl/remind-lib /home/openclaw/bin/remind-impl/
           install -m 755 bin/install-remind-wrappers /home/openclaw/bin/
           install -m 755 bin/standup-intake /home/openclaw/bin/'