name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'
      - name: Ensure existing reminder fixture prerequisites (hosted runner only)
        run: |
          if ! command -v jq >/dev/null || ! command -v column >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y jq bsdextrautils
          fi
      - name: Local fixtures only (no native runtime or activation)
        run: |
          mkdir -p /tmp/opencode
          export TMPDIR=/tmp/opencode PYTHONDONTWRITEBYTECODE=1
          python3 -m unittest discover -s bin/pantheon_ops -p '*_test.py'
          bun test plugins/pantheon-message-guard
          bash bin/remind.test.sh
          bash bin/standup-intake.test.sh
          bash laptop/seneca-standup.test.sh
          bash bin/install-pantheon-helpers.test.sh
          for f in bin/install-pantheon-helpers bin/install-pantheon-helpers.test.sh bin/standup-intake laptop/seneca-standup; do bash -n "$f"; done
          git diff --check

  deploy:
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - name: Set up ssh
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts

      - name: Deploy
        run: |
          ssh -o IdentitiesOnly=yes \
          "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
          'set -euo pipefail
           cd /opt/pantheon
           git fetch origin main
           git reset --hard origin/main
            export TMPDIR=/tmp/opencode PYTHONDONTWRITEBYTECODE=1
            mkdir -p "$TMPDIR"
            bash bin/remind.test.sh
            bash bin/standup-intake.test.sh
            python3 -m unittest discover -s bin/pantheon_ops -p "*_test.py"
            bash laptop/seneca-standup.test.sh
            bash bin/install-pantheon-helpers.test.sh
           # OpenClaw polls the bot token now; a second poller (the old container) breaks it.
           docker rm -f pantheon >/dev/null 2>&1 || true
            # Passive copy only: no baseline, daemon reload, enable, plugin install or sends.
            bash bin/install-pantheon-helpers server /home/openclaw/bin /home/openclaw/.config/systemd/user'
